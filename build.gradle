plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.143'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://mvn.devos.one/snapshots' }
    maven { url = 'https://maven.blamejared.com' }
}

dependencies {
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    implementation("com.tterrag.registrate:Registrate:${registrate_version}")
    compileOnly("mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}")
    runtimeOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")
}

neoForge {
    version = neo_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        data {
            data()
            programArguments.addAll '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
        }

        configureEach {
            systemProperty 'neoforge.logging.console.level', 'info'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

def insulatedWrenchTexture = tasks.register('insulatedWrenchTexture') {
    def overlay = file('src/main/overlays/insulated_wrench.png')
    def outputRoot = layout.buildDirectory.dir('generated/textures')
    inputs.file overlay
    inputs.property 'create_version', create_version
    outputs.dir outputRoot
    doLast {
        def createJar = configurations.compileClasspath.find { it.name.startsWith("create-${minecraft_version}-") }
        def base = new java.util.zip.ZipFile(createJar).withCloseable { zip ->
            zip.getInputStream(zip.getEntry('assets/create/textures/item/wrench.png')).withCloseable { javax.imageio.ImageIO.read(it) }
        }
        def image = new java.awt.image.BufferedImage(base.width, base.height, java.awt.image.BufferedImage.TYPE_INT_ARGB)
        def graphics = image.createGraphics()
        graphics.drawImage(base, 0, 0, null)
        graphics.drawImage(javax.imageio.ImageIO.read(overlay), 0, 0, null)
        graphics.dispose()
        def target = outputRoot.get().file('assets/create_endergy/textures/item/insulated_wrench.png').asFile
        target.parentFile.mkdirs()
        javax.imageio.ImageIO.write(image, 'png', target)
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    srcDir files(layout.buildDirectory.dir('generated/textures')).builtBy(insulatedWrenchTexture)
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
        mod_id: mod_id,
        mod_name: mod_name,
        mod_version: mod_version,
        mod_authors: mod_authors,
        mod_description: mod_description,
        minecraft_version_range: minecraft_version_range,
        neo_version_range: neo_version_range,
        loader_version_range: loader_version_range,
        create_version_range: create_version_range,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties + [project: project]
    }
}
